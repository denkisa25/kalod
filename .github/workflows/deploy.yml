# Builds the site on a clean runner and publishes the built output to the
# `deploy` branch. cPanel's Git Version Control tracks THAT branch and its
# .cpanel.yml only copies files — no npm, no node, no build.
#
# WHY. Building on the shared host was abandoned after five distinct resource
# walls, each only visible once the previous was fixed: rayon's thread pool
# (EAGAIN), esbuild's Go runtime (died creating its fourth OS thread), libvips
# (segfault on the studio photos), and V8 aborting under cPanel's deploy cgroup
# — first a heap OOM at ~46 MB, then with no message at all. The account's real
# ceilings are LVE cgroup limits that ulimit reports as "unlimited", so every
# round was guesswork against something unmeasurable.
#
# WHY NOT SSH. The obvious answer — build here, rsync to the host — is not
# available: the host refuses connections on 22 and every common alternative,
# so SSH is not enabled for this account. Even if support enabled it, GitHub's
# runners use dynamic shared IPs, so an IP allowlist would not help.
#
# What DOES work is cPanel's git deploy itself: it pulls, runs its tasks in
# order and exits cleanly every time. Only the build ever failed. So this keeps
# that mechanism and removes the part that breaks.
name: build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  # required to push the built output to the deploy branch
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - run: npm ci
      - run: npm test

      # SITE_BASE and INDEXABLE are repository VARIABLES, not secrets, so the
      # launch flip is a settings change rather than a commit: set SITE_BASE=/
      # and INDEXABLE=true when the site moves to the domain root. Defaults keep
      # today's /new preview behaviour, and INDEXABLE defaults to unset, which
      # is the safe direction to fail in.
      - name: build
        env:
          SITE_BASE: ${{ vars.SITE_BASE || '/new' }}
          INDEXABLE: ${{ vars.INDEXABLE }}
        run: |
          echo "SITE_BASE=$SITE_BASE  INDEXABLE=${INDEXABLE:-<unset>}"
          npm run build
          test -f dist/index.html || { echo "::error::build produced no index.html"; exit 1; }
          echo "pages built: $(find dist -name '*.html' | wc -l)"

      # The deploy branch is an ARTIFACT, not history. It is rebuilt as a single
      # commit and force-pushed every time, so the repository does not
      # accumulate a new copy of every image on every deploy.
      - name: publish to deploy branch
        env:
          SITE_BASE: ${{ vars.SITE_BASE || '/new' }}
        run: |
          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/dist"
          cp -R dist/. "$STAGE/dist/"

          # The deploy branch carries its own .cpanel.yml, which does nothing
          # but copy. Written here so the workflow is the single source of truth
          # for it and it cannot drift from what CI produces.
          cat > "$STAGE/.cpanel.yml" <<'CPANEL'
          ---
          deployment:
            tasks:
              - export DEPLOYPATH=/home/$USER/public_html/kalodimitrov.com/new/
              - export REPO_PATH=/home/$USER/repositories/kalodimitrov
              - /bin/cp -R $REPO_PATH/dist/. $DEPLOYPATH
          CPANEL

          # The server-side checkout still holds node_modules/, .astro/ and other
          # debris from when it tracked `main` and ran builds in place. On main
          # those were gitignored; this branch previously had no .gitignore, so
          # git reported the tree as dirty — and cPanel DISABLES "Deploy HEAD
          # Commit" on a dirty working tree. Ignoring them here is what makes
          # the button clickable without anyone having to hand-clean the server.
          cat > "$STAGE/.gitignore" <<'IGNORE'
          node_modules/
          .astro/
          .cache/
          npm-debug.log*
          .DS_Store
          tmp/
          .env
          .env.local
          IGNORE

          cat > "$STAGE/README.md" <<'NOTE'
          # deploy branch — generated, do not edit

          Built output published by .github/workflows/deploy.yml on `main`.
          Force-pushed as a single commit on every deploy, so nothing here is
          history and any commit you make will be overwritten.

          cPanel's Git Version Control tracks this branch. Its .cpanel.yml only
          copies dist/ into the docroot — the build happens in CI because the
          host cannot run it (see the workflow header for the full account).

          Change the site by committing to `main`.
          NOTE

          cd "$STAGE"
          git init -q
          git checkout -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "build ${GITHUB_SHA::7} (SITE_BASE=${SITE_BASE})"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            deploy
          echo "published $(find dist -name '*.html' | wc -l) pages to the deploy branch"
